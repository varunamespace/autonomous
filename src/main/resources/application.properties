spring.application.name=autonomous

# MCP client -> local Python RAG server (streamable HTTP transport)
spring.ai.mcp.client.streamable-http.connections.python-rag.url=http://localhost:8000
spring.ai.mcp.client.streamable-http.connections.python-rag.endpoint=/mcp
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5
spring.ai.ollama.chat.options.temperature=0.7
server.port=8080